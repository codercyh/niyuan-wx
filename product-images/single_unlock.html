<!DOCTYPE html><html><head><meta charset="utf-8"><title>单次解锁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px}
body{background:linear-gradient(135deg,#FF6B6B 0%,#FF6B35 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.32) 0%,transparent 64%);top:46%;left:50%;transform:translate(-50%,-50%);z-index:0}
.ring{position:absolute;width:900px;height:900px;border-radius:50%;border:3px solid rgba(255,255,255,0.20);top:50%;left:50%;transform:translate(-50%,-50%);z-index:0}
.icon{font-size:380px;line-height:1;filter:drop-shadow(0 20px 44px rgba(0,0,0,0.34));z-index:1;margin-top:-20px}
.title{font-size:100px;font-weight:800;color:#fff;letter-spacing:12px;margin-top:24px;text-shadow:0 6px 22px rgba(0,0,0,0.26);z-index:1}
.price{margin-top:40px;background:rgba(10,10,20,0.42);color:#fff;font-size:60px;font-weight:700;padding:14px 54px;border-radius:64px;box-shadow:0 10px 28px rgba(0,0,0,0.20);z-index:1}
.price small{font-size:36px;opacity:0.9;margin-right:4px}
</style></head>
<body>
  <div class="ring"></div>
  <div class="glow"></div>
  <div class="icon">🔑</div>
  <div class="title">单次解锁</div>
  <div class="price"><small>¥</small>9.9</div>
</body></html>
