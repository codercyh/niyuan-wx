<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D20"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="70%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4338CA"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="512" cy="480" r="300" fill="rgba(99,102,241,0.15)"/>
  <!-- Crystal orb -->
  <circle cx="512" cy="480" r="220" fill="url(#orb)"/>
  <!-- Highlight -->
  <ellipse cx="450" cy="380" rx="60" ry="40" fill="rgba(255,255,255,0.2)"/>
  <!-- Stars -->
  <text x="150" y="200" font-size="60" fill="#F59E0B" opacity="0.8">✦</text>
  <text x="800" y="300" font-size="40" fill="#FBBF24" opacity="0.6">✦</text>
  <text x="700" y="700" font-size="50" fill="#F59E0B" opacity="0.7">✦</text>
  <text x="200" y="650" font-size="35" fill="#FBBF24" opacity="0.5">✦</text>
  <!-- Emoji -->
  <text x="512" y="560" font-size="200" text-anchor="middle" fill="white" font-family="Arial">🔮</text>
</svg>
